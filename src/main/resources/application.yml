spring:
  application:
    name: payment-gateway

server:
  port: ${SERVER_PORT:8098}

payment:
  security:
    bff-token: ${BFF_TO_PAYMENT_GATEWAY_TOKEN:}
    payment-service-token: ${PAYMENT_GATEWAY_TO_PAYMENT_SERVICE_TOKEN:}
    stripe-gateway-token: ${PAYMENT_GATEWAY_TO_STRIPE_GATEWAY_TOKEN:}

services:
  payment-service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8099}
  stripe-gateway:
    base-url: ${STRIPE_GATEWAY_URL:http://localhost:8100}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
